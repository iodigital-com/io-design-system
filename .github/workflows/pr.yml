name: PR — Quality Gates

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Governance & static checks (fast, no build required)
  # ──────────────────────────────────────────────────────────────────────────
  governance:
    name: Governance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Token naming
        run: node scripts/check-token-cssvar-naming.cjs

      - name: Token runtime reconciliation
        run: node scripts/check-token-runtime-reconciliation.cjs

      - name: Token doc coverage
        run: node scripts/check-token-doc-coverage.cjs

      - name: Style literals allowlist
        run: node scripts/check-style-literals.cjs

      - name: Storefront status governance
        run: node scripts/check-storefront-status-governance.cjs

      - name: Agency governance
        run: node scripts/agency-validate-governance.cjs

      - name: Events guard (no io-prefixed events)
        run: node scripts/check-no-io-prefixed-events.cjs

      - name: Lint
        run: npm run lint

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Build + API contract check
  # ──────────────────────────────────────────────────────────────────────────
  api-contract:
    name: API contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build components
        run: npm run build:components

      - name: Storefront type sync drift
        run: node scripts/sync-stencil-assets.cjs --check

      - name: Check public API for breaking changes
        id: api_check
        run: node scripts/check-api-surface.cjs --json > /tmp/api-breaks.json; echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        # We capture JSON output regardless of exit code, then decide below.
        continue-on-error: true

      - name: Show API break details (if any)
        if: steps.api_check.outputs.exit_code != '0'
        run: |
          echo "## ⚠️  Breaking API changes detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following public API members were removed or renamed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/api-breaks.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**If intentional:** add the \`breaking-change\` label to this PR, update \`CHANGELOG.md\`, then run \`npm run api:snapshot\` and commit the updated \`docs/api-surface.json\`." >> $GITHUB_STEP_SUMMARY

      - name: Fail if breaking changes and PR is not labelled
        if: steps.api_check.outputs.exit_code != '0'
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q "breaking-change"; then
            echo "[api-surface] Breaking changes acknowledged via 'breaking-change' label."
          else
            echo "[api-surface] Breaking changes require the 'breaking-change' label and a CHANGELOG.md entry."
            cat /tmp/api-breaks.json
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Tests
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [governance]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Bundle size budgets
  # ──────────────────────────────────────────────────────────────────────────
  size-limit:
    name: Bundle size budgets
    runs-on: ubuntu-latest
    needs: [governance]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build components
        run: npm run build:components

      - name: Check size budgets
        id: size_report
        run: |
          npm run size | tee /tmp/size-report.txt
          {
            echo 'report<<EOF'
            cat /tmp/size-report.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment size report on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- size-budget-report -->';
            const body = `${marker}\n## Bundle Size Report\n\n\`\`\`text\n${{ steps.size_report.outputs.report }}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  # ──────────────────────────────────────────────────────────────────────────
  # 5. TypeScript (storefront)
  # ──────────────────────────────────────────────────────────────────────────
  type-check:
    name: TypeScript check
    runs-on: ubuntu-latest
    needs: [api-contract]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build components (generates types)
        run: npm run build:components

      - name: Sync Stencil assets to storefront
        run: node scripts/sync-stencil-assets.cjs

      - name: Type coverage (io-components)
        run: npm run type-coverage

      - name: TypeScript — storefront
        run: npm run type-check

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Security audit
  # ──────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    needs: [governance]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high --omit=dev

  storefront:
    name: Storefront build
    runs-on: ubuntu-latest
    needs: [type-check, security-audit, size-limit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build components
        run: npm run build:components

      - name: Sync Stencil assets
        run: node scripts/sync-stencil-assets.cjs

      - name: Build storefront
        run: npm run build:storefront

      - name: Lighthouse CI
        run: npm run lighthouse:ci

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: io-storefront/lighthouseci

      - name: Upload static export for E2E
        uses: actions/upload-artifact@v4
        with:
          name: storefront-out
          path: io-storefront/out
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # 7. E2E tests (Playwright — runs against pre-built static export)
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [storefront]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: storefront-out
          path: io-storefront/out

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run --workspace @iodigital-com/storefront test:e2e
        env:
          CI: true
