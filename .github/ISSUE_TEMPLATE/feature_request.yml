name: Feature Request
description: Propose a new component, prop, token, or storefront page.
title: "feat({scope}): {short description}"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new component, new prop, new token, or any other additive change to the design system.

  - type: dropdown
    id: scope
    attributes:
      label: Feature area
      options:
        - New component
        - New prop / event / method on existing component
        - New design token
        - Storefront page or section
        - Framework wrapper improvement
        - Tooling / governance script
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Who is affected and how?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature. For components, include the proposed prop API and a usage example.
      placeholder: |
        Proposed API:
        ```html
        <io-skeleton variant="text" width="200px" />
        ```
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know when this feature is done?
      placeholder: |
        - [ ] Component renders correctly in all browsers
        - [ ] Keyboard accessible
        - [ ] Storefront page exists with examples
        - [ ] Changeset created
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider? Why is this the right one?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1 — Blocking another team / critical path
        - P2 — Important but not blocking
        - P3 — Nice to have
    validations:
      required: true
