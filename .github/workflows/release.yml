name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm provenance attestation
      packages: write # required for GitHub Packages publish

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@iodigital-com'

      - name: Install dependencies
        run: npm ci --registry https://registry.npmjs.org

      - name: Build components + wrappers
        run: npm run build

      - name: Create Release PR or detect publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: npx changeset publish
        env:
          # ORG_PACKAGES_TOKEN must be a PAT from an iodigital-com org member
          # with write:packages + read:packages scope.
          # GITHUB_TOKEN lacks permission to read/write @iodigital-com packages.
          NODE_AUTH_TOKEN: ${{ secrets.ORG_PACKAGES_TOKEN }}
