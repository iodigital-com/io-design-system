name: Playground E2E — Framework Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'io-components/src/**'
      - 'io-components-react/**'
      - 'io-components-angular/**'
      - 'io-components-vue/**'
      - 'io-playground-react/**'
      - 'io-playground-angular/**'
      - 'io-playground-vue/**'
      - 'io-playground-html/**'

concurrency:
  group: playground-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Build components + wrappers first (shared artifact) ──────────────────
  build:
    name: Build components + wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: |
            io-components/dist
            io-components/loader
            io-components/dist-custom-elements
            io-components-react/dist
            io-components-vue/dist
            io-components-angular/dist
          retention-days: 1

  # ── React / Next.js 15 playground ────────────────────────────────────────
  react:
    name: React 19 / Next.js 15
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/download-artifact@v4
        with:
          name: built-packages
      - run: npm ci
      - run: npx playwright install chromium --with-deps
        working-directory: io-playground-react
      - run: npm run test:e2e
        working-directory: io-playground-react
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: react-playwright-report
          path: io-playground-react/playwright-report
          retention-days: 7

  # ── Angular 20 playground ────────────────────────────────────────────────
  angular:
    name: Angular 20
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/download-artifact@v4
        with:
          name: built-packages
      - run: npm ci
      - run: npx playwright install chromium --with-deps
        working-directory: io-playground-angular
      - run: npm run test:e2e
        working-directory: io-playground-angular
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: angular-playwright-report
          path: io-playground-angular/playwright-report
          retention-days: 7

  # ── Vue 3 playground ─────────────────────────────────────────────────────
  vue:
    name: Vue 3
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/download-artifact@v4
        with:
          name: built-packages
      - run: npm ci
      - run: npx playwright install chromium --with-deps
        working-directory: io-playground-vue
      - run: npm run test:e2e
        working-directory: io-playground-vue
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vue-playwright-report
          path: io-playground-vue/playwright-report
          retention-days: 7

  # ── Native HTML playground ───────────────────────────────────────────────
  html:
    name: Native HTML
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/download-artifact@v4
        with:
          name: built-packages
      - run: npm ci
      - run: npx playwright install chromium --with-deps
        working-directory: io-playground-html
      - run: npm run test:e2e
        working-directory: io-playground-html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: html-playwright-report
          path: io-playground-html/playwright-report
          retention-days: 7
